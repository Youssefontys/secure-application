# Builds the image, makes the SBoM and scans it: on every pull request to main in the job check, which then also
# runs the security test, publishes nothing and is made required by a ruleset on main (MIT-39), and on every push to main
# again in the job image, which puts the image on ghcr.io after a clean scan with the token of the run. After that,
# deploy.yml puts the image on Azure once you approve it (MIT-44).
# A package created this way gets the visibility of the repo; Container Apps therefore pulls it without signing in.
# Two tags, never latest (MIT-03): the commit, and the content of app/ (the tree hash of git). deployment.py azure looks for
# the second one: a commit that only changes Terraform or the BoK thus needs no new build.
name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No rights by default; every job only gets what it needs.
permissions: {}

env:
  # Pinned on version and digest (MIT-03); Dependabot does not see an image in a run line, so you update it yourself.
  TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  # The brake on a pull request, only with read rights: on a pull request from a fork GitHub gives no more anyway.
  # The steps with an & are in the job image once more, with a *: this way the check scans exactly what is published.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Pinned on a commit, not on a tag that can move (MIT-03); Dependabot keeps it up to date (MIT-33).
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io wants lower case; the label links the package to this repo.
      - &build
        name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_SHA" -t "$image:app-$(git rev-parse HEAD:app)" app
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # The SBoM (MIT-36): all components of the image as CycloneDX, only the list, without vulnerabilities or VEX. Trivy reads
      # the image as a tar file, without the Docker socket, so it cannot change the image that is pushed later.
      # Trivy names the main component after the tar file; jq puts the name and tag of the image there instead.
      - &sbom
        name: Make SBoM
        run: |
          docker save "$IMAGE:$GITHUB_SHA" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY" image --input /scan/image.tar --format cyclonedx --output /scan/sbom.json --quiet
          jq --arg name "$IMAGE:$GITHUB_SHA" '.metadata.component.name = $name' "$RUNNER_TEMP/sbom.json" > sbom.cdx.json

      # Kept with the run, also if the scan after this finds a vulnerability; GitHub keeps it 90 days, the maximum for a public repo.
      - &keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Trivy also filters out a not_affected without a reason (T-115). So first ourselves: every statement in the VEX has a
      # valid justification and an explanation, or for affected an action, and names packages with a version (MIT-41).
      - &vex
        name: Check VEX
        run: |
          jq -e '
            def ok:
              (if .status == "not_affected" then (.justification | IN("component_not_present", "vulnerable_code_not_present",
                   "vulnerable_code_not_in_execute_path", "vulnerable_code_cannot_be_controlled_by_adversary",
                   "inline_mitigations_already_exist")) and ((.impact_statement // "") != "")
               elif .status == "affected" then (.action_statement // "") != ""
               else .status == "under_investigation" end)
              and (.products | length > 0) and all(.products[]; .["@id"] | test("^pkg:[a-z]+/[^@]+@."));
            [.statements[] | select(ok | not) | .vulnerability.name] | if . == [] then true else error("invalid: \(.)") end
          ' vex/openvex.json

      # The brake (MIT-35), on the SBoM: every known vulnerability of HIGH or CRITICAL makes the job fail, also if there is no
      # fix yet, unless vex/openvex.json says for that version that the image is not affected (MIT-41). The filtered findings
      # are listed separately in the log. On a pull request the ruleset then blocks the merge, on a push the job stops before publishing.
      - &scan
        name: Scan for known vulnerabilities
        run: docker run --rm -v "$PWD:/scan" "$TRIVY" sbom /scan/sbom.cdx.json --severity HIGH,CRITICAL --vex /scan/vex/openvex.json --show-suppressed --exit-code 1 --no-progress

      # The security test (tests/securitytest.py) against the stack of compose.yaml, only in the check: if a check fails,
      # the job fails and the ruleset blocks the merge (MIT-39). Without a terminal deployment.py asks no questions and makes
      # throwaway secrets in .env, which only exist on this runner. The step takes about 212 seconds (T-125).
      - name: Security test
        timeout-minutes: 20
        run: |
          python3 scripts/deployment.py local < /dev/null
          python3 tests/securitytest.py --wipe

  # On a push to main, or by hand: the same steps, and only after a clean scan to ghcr.io.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout
      - *build
      - *sbom
      - *keep
      - *vex
      - *scan

      # The token through stdin and an environment variable, not in the command itself.
      - name: Push to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"

