# Bouwt de image, maakt de SBoM en scant die: bij elke pull request naar main in de job check, die niets publiceert en
# die een ruleset op main verplicht maakt (MIT-39), en bij elke push naar main opnieuw in de job image, die de image na
# een schone scan op ghcr.io zet met het token van de run.
# Een pakket dat zo ontstaat, krijgt de zichtbaarheid van de repo; Container Apps haalt het dus zonder inloggen op.
# Twee tags, nooit latest (MIT-03): de commit, en de inhoud van app/ (de tree-hash van git). deployment.py azure zoekt op de
# tweede: een commit die alleen Terraform of de BoK verandert, heeft zo geen nieuwe build nodig.
name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Standaard geen rechten; elke job krijgt alleen wat hij nodig heeft.
permissions: {}

env:
  # Vast op versie en digest (MIT-03); Dependabot ziet een image in een run-regel niet, dus die werk je zelf bij.
  TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  # De rem bij een pull request, alleen met leesrechten: bij een pull request vanuit een fork geeft GitHub sowieso niet meer.
  # De stappen met een & staan in de job image nog een keer, met een *: zo scant de check precies wat er gepubliceerd wordt.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Vast op een commit, niet op een tag die kan verschuiven (MIT-03); Dependabot houdt hem bij (MIT-33).
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io wil kleine letters; het label koppelt het pakket aan deze repo.
      - &bouwen
        name: Bouwen
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_SHA" -t "$image:app-$(git rev-parse HEAD:app)" app
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # De SBoM (MIT-36): alle onderdelen van de image als CycloneDX, alleen de lijst, zonder lekken of VEX. Trivy leest de
      # image als tar-bestand, zonder de Docker-socket, dus kan het de image die straks gepusht wordt niet veranderen.
      # Trivy noemt het hoofdonderdeel naar het tar-bestand; jq zet er de naam en tag van de image voor in de plaats.
      - &sbom
        name: SBoM maken
        run: |
          docker save "$IMAGE:$GITHUB_SHA" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY" image --input /scan/image.tar --format cyclonedx --output /scan/sbom.json --quiet
          jq --arg name "$IMAGE:$GITHUB_SHA" '.metadata.component.name = $name' "$RUNNER_TEMP/sbom.json" > sbom.cdx.json

      # Bij de run bewaard, ook als de scan hierna een lek vindt; GitHub houdt hem 90 dagen, het maximum voor een openbare repo.
      - &bewaren
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Trivy filtert ook een not_affected zonder reden weg (T-115). Daarom eerst zelf: elke verklaring in de VEX heeft een
      # geldige justification en een uitleg, of bij affected een actie, en noemt pakketten met versie (MIT-41).
      - &vex
        name: VEX controleren
        run: |
          jq -e '
            def ok:
              (if .status == "not_affected" then (.justification | IN("component_not_present", "vulnerable_code_not_present",
                   "vulnerable_code_not_in_execute_path", "vulnerable_code_cannot_be_controlled_by_adversary",
                   "inline_mitigations_already_exist")) and ((.impact_statement // "") != "")
               elif .status == "affected" then (.action_statement // "") != ""
               else .status == "under_investigation" end)
              and (.products | length > 0) and all(.products[]; .["@id"] | test("^pkg:[a-z]+/[^@]+@."));
            [.statements[] | select(ok | not) | .vulnerability.name] | if . == [] then true else error("ongeldig: \(.)") end
          ' vex/openvex.json

      # De rem (MIT-35), op de SBoM: elk bekend lek van HIGH of CRITICAL laat de job falen, ook als er nog geen oplossing is,
      # tenzij vex/openvex.json voor die versie zegt dat de image niet geraakt wordt (MIT-41). De weggefilterde meldingen
      # staan apart in de log. Bij een pull request houdt de ruleset dan de merge tegen, bij een push stopt de job vóór het publiceren.
      - &scannen
        name: Scannen op bekende lekken
        run: docker run --rm -v "$PWD:/scan" "$TRIVY" sbom /scan/sbom.cdx.json --severity HIGH,CRITICAL --vex /scan/vex/openvex.json --show-suppressed --exit-code 1 --no-progress

  # Bij een push naar main, of met de hand: dezelfde stappen, en pas na een schone scan naar ghcr.io.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout
      - *bouwen
      - *sbom
      - *bewaren
      - *vex
      - *scannen

      # Het token via stdin en een omgevingsvariabele, niet in de opdracht zelf.
      - name: Pushen naar ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
