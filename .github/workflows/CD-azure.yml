# Puts the image that Image published on Azure (MIT-44): after Image succeeded on a push to main that changed app/,
# or by hand. Only in the environment azure, which only allows main and waits for your approval. Azure accepts the
# short-lived OIDC token of the job; there is no password or key in GitHub, and the three IDs are environment secrets
# only so the public log does not show them. Without them (no Azure, or a fork) there is nothing to do.
name: Deploy

on:
  workflow_run:
    workflows: [Image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# No rights by default; each job only gets what it needs.
permissions: {}

jobs:
  # Only a new image is worth an approval. The tag is the tree hash of app/ (see CI-image.yml): the same tree is the same
  # image, so after a merge that only changes the BoK or the README nothing waits for you. By hand it always deploys.
  # Compared with the first parent, the previous main of a merge commit. No checkout: through the API.
  changed:
    # Not after a pull request: a fork can name its branch main too. Not after a failed Image: then there is no new image.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      deploy: ${{ steps.tree.outputs.deploy }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Did app/ change?
        id: tree
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/git/trees/$1" --jq '.tree[] | select(.path == "app") | .sha'; }
          now=$(tree "$SHA")
          before=$(tree "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.parents[0].sha')")
          echo "tree=$now" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$now" != "$before" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "app/ did not change (app-$now): the same image, so nothing to deploy and no approval asked."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: azure
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TREE: ${{ needs.changed.outputs.tree }}
    steps:
      # Only the image changes: the rest of the template comes from Azure itself, so Terraform stays the source of
      # everything else. The names come from terraform/main.tf (local.name).
      - name: Deploy to Azure
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then echo "No deployment to Azure set up in the environment azure; nothing to do."; exit 0; fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:app-$TREE"
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" \
            --allow-no-subscriptions -o none
          app="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/rg-notes/providers/Microsoft.App/containerApps/ca-notes?api-version=2025-07-01"
          az rest --method get --uri "$app" > "$RUNNER_TEMP/app.json"
          jq --arg image "$image" '{properties: {template: (.properties.template | del(.revisionSuffix)
            | (.containers[] | select(.name == "app") | .image) = $image)}}' "$RUNNER_TEMP/app.json" > "$RUNNER_TEMP/patch.json"
          az rest --method patch --uri "$app" --body "@$RUNNER_TEMP/patch.json" -o none
          # Ready when the newest revision is also the newest ready one.
          for _ in $(seq 30); do
            az rest --method get --uri "$app" > "$RUNNER_TEMP/app.json"
            ready=$(jq -r '.properties.provisioningState == "Succeeded" and .properties.latestRevisionName == .properties.latestReadyRevisionName' "$RUNNER_TEMP/app.json")
            [ "$ready" = true ] && break
            sleep 10
          done
          [ "$ready" = true ] || { echo "The new revision did not become ready in 5 minutes."; exit 1; }
          echo "Running: $(jq -r '.properties.template.containers[] | select(.name == "app") | .image' "$RUNNER_TEMP/app.json")"
          fqdn=$(jq -r .properties.configuration.ingress.fqdn "$RUNNER_TEMP/app.json")
          curl -sSf -o /dev/null --retry 10 --retry-delay 10 --retry-all-errors -w "https://$fqdn/login: %{http_code}\n" "https://$fqdn/login"
