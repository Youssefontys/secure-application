# Onderzoek, deelvraag 3: SBoM's van dezelfde image van Trivy, Syft, cdxgen en cyclonedx-py, elk gescand met Trivy en
# met Grype en gecontroleerd met cyclonedx-cli, naast wat er echt in de draaiende image zit. Op een runner van GitHub,
# niet lokaal. Alleen op labbranches (lab/...), en alleen als deze meting zelf verandert; de pipeline op main verandert
# hier niet door. De scripts staan in lab/dv3/.
name: DV3-meting

on:
  push:
    branches: ["lab/**"]
    paths: ["lab/dv3/*.py", ".github/workflows/dv3-meting.yml"]
  workflow_dispatch:

# Standaard geen rechten; de job leest alleen de code, en de image op ghcr.io is openbaar.
permissions: {}

# Met pipefail: een fout vóór tee laat de stap dan falen.
defaults:
  run:
    shell: bash

env:
  # De image van main na deelvraag 2 (c0a21ba), dezelfde als in de BoK (T-117).
  IMAGE: ghcr.io/youssefontys/secure-application:c0a21baff0b568ab7f269de19a225888b44a8bbf
  # Vaste versies, minstens twee weken oud op 20-10-2026; cyclonedx-cli op de SHA-256 die GitHub bij de release noemt.
  CDXGEN: "12.8.5"
  CYCLONEDX_BOM: "7.5.0"
  CYCLONEDX_CLI: https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
  CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746

jobs:
  meting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cdxgen vraagt Node.js 24 of nieuwer.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: CycloneDX-tools installeren
        run: |
          npm install --global --no-fund --no-audit "@cyclonedx/cdxgen@$CDXGEN"
          python3 -m pip install --user --quiet "cyclonedx-bom==$CYCLONEDX_BOM"
          curl -sSfL -o "$RUNNER_TEMP/cyclonedx" "$CYCLONEDX_CLI"
          echo "$CYCLONEDX_CLI_SHA256  $RUNNER_TEMP/cyclonedx" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cyclonedx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Meten
        run: |
          { echo '```'; cdxgen --version; cyclonedx-py --version; cyclonedx --version
            python3 lab/dv3/meet.py "$IMAGE" "$RUNNER_TEMP/meting"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # De SBoM's, de scans, binnen.json en resultaten.json; ook als de meting halverwege faalt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dv3-meting
          path: |
            ${{ runner.temp }}/meting
            !${{ runner.temp }}/meting/img.tar
          retention-days: 90
