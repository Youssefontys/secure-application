# Onderzoek, deelvraag 1: Trivy en Syft met Grype op dezelfde images, elke meting op een eigen, schone runner.
# Alleen op labbranches (lab/...); de pipeline op main verandert hier niet door. De scripts staan in lab/benchmark/.
name: SBoM-benchmark

on:
  push:
    branches: ["lab/**"]
  workflow_dispatch:

# Standaard geen rechten; de jobs lezen alleen de code.
permissions: {}

# Met pipefail: een fout vóór tee laat de stap dan falen.
defaults:
  run:
    shell: bash

env:
  # Dezelfde versies als in de labmeting van 18 oktober 2026, vast op digest.
  TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  SYFT: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  GRYPE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe

jobs:
  meten:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [trivy, syft, syft-sbom]
        image: [schoon, metpip]
        herhaling: [1, 2, 3, 4, 5]
    env:
      IMAGE: ${{ matrix.image }}
      HERHALING: ${{ matrix.herhaling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Het image met pip: de regel die pip weghaalt eruit, zoals in pull request #2 (BoK, T-105).
      - name: Image bouwen (niet gemeten)
        run: |
          if [ "$IMAGE" = metpip ]; then
            sed -i -e '/&& pip uninstall --yes pip/d' -e 's/-r requirements.txt [\]$/-r requirements.txt/' app/Dockerfile
            # Een achtergebleven backslash plakt de volgende regel aan RUN vast, en dan bouwt hij stil iets anders.
            if grep -q -e "pip uninstall" -e 'requirements.txt [\]$' app/Dockerfile; then exit 1; fi
          fi
          docker build -q -t lab/notes app
          mkdir -p "$RUNNER_TEMP/in"
          docker save lab/notes -o "$RUNNER_TEMP/in/img.tar"
          docker run --rm --entrypoint python lab/notes -m pip --version || echo "geen pip in het image"

      - name: Tool-images ophalen (niet gemeten)
        run: |
          for image in "$TRIVY" "$SYFT" "$GRYPE"; do docker pull -q "$image"; done

      - name: Meten
        run: bash lab/benchmark/meet.sh "${{ matrix.variant }}" "$RUNNER_TEMP/in" "$RUNNER_TEMP/uit"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meting-${{ matrix.variant }}-${{ matrix.image }}-${{ matrix.herhaling }}
          path: |
            ${{ runner.temp }}/uit/meting.json
            ${{ runner.temp }}/uit/sbom.json
            ${{ runner.temp }}/uit/scan.json
          retention-days: 90

  samenvatten:
    needs: meten
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meting-*
          path: metingen
      - name: Samenvatting
        run: python3 lab/benchmark/samenvatting.py metingen | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metingen-csv
          path: metingen/metingen.csv
          retention-days: 90
