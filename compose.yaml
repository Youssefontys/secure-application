# Lokale baseline: app en database.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: notities
      POSTGRES_USER: notities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
    volumes:
      # Vanaf PostgreSQL 18 hoort het volume op /var/lib/postgresql. De image
      # zet de data zelf in een submap per hoofdversie (18/docker).
      - dbdata:/var/lib/postgresql
      # Draait alleen bij de allereerste start van een leeg volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notities -d notities"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?zet FLASK_SECRET_KEY in .env}
      # BASELINE: de app verbindt met dezelfde (eigenaar)rol waarmee de
      # database is aangemaakt. Zie MC-08 in BoK/Threat Analysis.
      DATABASE_URL: postgresql://notities:${POSTGRES_PASSWORD}@db:5432/notities
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  dbdata:
