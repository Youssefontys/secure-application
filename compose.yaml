# App en database voor lokaal gebruik.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: notities
      POSTGRES_USER: notities
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      # Alleen voor app-password.sh; de app zelf krijgt het wachtwoord van de eigenaar niet (MIT-27).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?zet APP_DB_PASSWORD in .env}
    volumes:
      # Vanaf PostgreSQL 18 hoort het volume op /var/lib/postgresql. De image
      # zet de data zelf in een submap per hoofdversie (18/docker).
      - dbdata:/var/lib/postgresql
      # Draait alleen bij de allereerste start van een leeg volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/app-password.sh:/docker-entrypoint-initdb.d/02-app-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notities -d notities"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?zet FLASK_SECRET_KEY in .env}
      # Versleutelt het TOTP-geheim (MIT-17); los van FLASK_SECRET_KEY, zodat elke sleutel één doel heeft.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?zet DATA_ENCRYPTION_KEY in .env}
      # Lokaal draait de app op HTTP; zonder deze regel geldt de veilige standaard (alleen HTTPS).
      HTTPS_ONLY: "0"
      # Hackstand, alleen tijdens de hacking week (MC-18); standaard streng en zonder uitzonderingen.
      THROTTLE_IP_MODE: ${THROTTLE_IP_MODE:-strict}
      THROTTLE_PAIR_EXEMPT_USERS: ${THROTTLE_PAIR_EXEMPT_USERS:-}
      # Een eigen rol: lezen en schrijven in de eigen tabellen, verder niets (MIT-27, MC-08).
      DATABASE_URL: postgresql://notities_app:${APP_DB_PASSWORD}@db:5432/notities
    ports:
      - "127.0.0.1:5000:5000"
    # Gezond zodra Flask antwoordt, zodat `docker compose up --wait` pas
    # terugkomt als de app echt bereikbaar is. De slim-image heeft geen curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scanners, alleen met een profile en voorlopig in commentaar; de CI-stap zet ze aan.
  # Gebruik daarna: docker compose --profile scan run --rm zap   (of trivy)
  # Versies vastzetten zoals in requirements.txt (MIT-03); <versie> invullen bij het aanzetten.
  #
  # zap:                                        # DAST: valt de draaiende app van buitenaf aan (ZAP baseline)
  #   image: ghcr.io/zaproxy/zaproxy:<versie>
  #   profiles: ["scan"]
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   command: zap-baseline.py -t http://app:5000/login -r zap-rapport.html
  #   volumes:
  #     - ./scan:/zap/wrk
  #
  # trivy:                                      # bekende kwetsbaarheden in de pakketten, plus een SBoM (CycloneDX)
  #   image: aquasec/trivy:<versie>
  #   profiles: ["scan"]
  #   # Scant de map, niet de image: de image scannen vraagt de Docker-socket, en die geeft root op de host.
  #   command: fs --format cyclonedx --output /scan/sbom.json /src
  #   volumes:
  #     - ./app:/src:ro
  #     - ./scan:/scan

volumes:
  dbdata:
