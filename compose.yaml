# App and database for local use.

services:
  db:
    # Pinned on version and digest (MIT-03), like the base image of the app.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Only for app-password.sh; the app itself does not get the password of the owner (MIT-27).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      # From PostgreSQL 18 the volume belongs on /var/lib/postgresql. The image
      # puts the data in a subfolder per major version itself (18/docker).
      - dbdata:/var/lib/postgresql
      # Runs only at the very first start of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/app-password.sh:/docker-entrypoint-initdb.d/02-app-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notes_owner -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
      # Encrypts the TOTP secret and the notes (MIT-17, MIT-18); lost or replaced means the notes are lost.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      # Locally the app runs on HTTP; without this line the safe default applies (HTTPS only).
      HTTPS_ONLY: "0"
      # Hackmode, only during the hacking week (MC-18); strict by default and without exceptions.
      THROTTLE_IP_MODE: ${THROTTLE_IP_MODE:-strict}
      THROTTLE_PAIR_EXEMPT_USERS: ${THROTTLE_PAIR_EXEMPT_USERS:-}
      # A role of its own: reading and writing in its own tables, nothing else (MIT-27, MC-08).
      DATABASE_URL: postgresql://notes_app:${APP_DB_PASSWORD}@db:5432/notes
    ports:
      - "127.0.0.1:5000:5000"
    # Healthy as soon as Flask answers, so `docker compose up --wait` only
    # returns when the app is really reachable. The slim image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ZAP, only with a profile and commented out for now; Trivy (SBoM and scan) already runs in CI (CI-image.yml).
  # Use after turning it on: docker compose --profile scan run --rm zap
  # Pin the version as in requirements.txt (MIT-03); fill in <version> when turning it on.
  #
  # zap:                                        # DAST: attacks the running app from outside (ZAP baseline)
  #   image: ghcr.io/zaproxy/zaproxy:<version>
  #   profiles: ["scan"]
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   command: zap-baseline.py -t http://app:5000/login -r zap-report.html
  #   volumes:
  #     - ./scan:/zap/wrk

volumes:
  dbdata:
