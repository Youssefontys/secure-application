{% extends "base.html" %}
{% block title %}Wachtwoord wijzigen{% endblock %}

{% block content %}
  <header class="bar">
    <h1>Wachtwoord wijzigen</h1>
    <a href="{{ url_for('notes') }}">Terug naar notities</a>
  </header>

  <form method="post" class="card">
    <label>Nieuw wachtwoord
      <input name="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Herhaal het nieuwe wachtwoord
      <input name="password_repeat" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Wachtwoord opslaan</button>
  </form>
{% endblock %}
