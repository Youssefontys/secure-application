{% extends "base.html" %}
{% block title %}Notitie aanpassen{% endblock %}

{% block content %}
  <header class="bar">
    <h1>Notitie aanpassen</h1>
    <a href="{{ url_for('notes') }}">Annuleren</a>
  </header>

  <form method="post" class="card">
    <label>Titel
      <input name="title" required value="{{ title }}">
    </label>
    <label>Notitie
      <textarea name="body" required>{{ body }}</textarea>
    </label>
    <button type="submit">Wijzigingen opslaan</button>
  </form>
{% endblock %}
