{% extends "base.html" %}
{% block title %}Notitie aanpassen{% endblock %}

{% block content %}
  <header class="bar">
    <h1>Notitie aanpassen</h1>
    <a href="{{ url_for('notes.index') }}">Annuleren</a>
  </header>

  <form method="post" class="card" data-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% include "_note_fields.html" %}
    <button type="submit">Wijzigingen opslaan</button>
  </form>
{% endblock %}
