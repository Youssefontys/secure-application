{# Title and body, shared by creating and editing. maxlength is a convenience in the
   browser; the real check is in read_note_form (MIT-04). #}
<label>Title <small>(max. {{ TITLE_MAX }} characters)</small>
  <input name="title" required maxlength="{{ TITLE_MAX }}" value="{{ title or '' }}">
</label>
<label>Note <small>(max. {{ BODY_MAX }} characters)</small>
  <textarea name="body" required maxlength="{{ BODY_MAX }}">{{ body or '' }}</textarea>
</label>
